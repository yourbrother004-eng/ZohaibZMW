
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZMW | Elite VIP Digital Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#f59e0b',
                dark: '#d97706',
                accent: '#fbbf24',
                glow: 'rgba(245, 158, 11, 0.4)'
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            animation: {
              'float-slow': 'floatSlow 8s ease-in-out infinite',
              'float-fast': 'floatFast 5s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
            },
            keyframes: {
              floatSlow: {
                '0%, 100%': { transform: 'translateY(0) rotate(0)' },
                '50%': { transform: 'translateY(-30px) rotate(5deg)' },
              },
              floatFast: {
                '0%, 100%': { transform: 'translateY(0) translateX(0)' },
                '50%': { transform: 'translateY(-20px) translateX(10px)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(1)' },
                '50%': { opacity: 0.7, transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* PERFORMANCE TURBO FIXES */
      * { 
        transition: background-color 0.3s ease, color 0.3s ease; 
        -webkit-tap-highlight-color: transparent;
      }
      
      body { 
        background-color: #ffffff; 
        color: #1a1a1a; 
        overflow-x: hidden; 
        text-rendering: optimizeLegibility;
      }
      
      .dark body { 
        background-color: #050505; 
        color: #f5f5f5; 
      }

      /* Sections that are off-screen won't lag the mobile browser */
      section {
        content-visibility: auto;
        contain-intrinsic-size: 1px 500px;
      }

      /* Enhanced VIP Scrolling Animations with GPU acceleration */
      .reveal { 
        opacity: 0; 
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        filter: blur(10px);
        will-change: transform, opacity;
        transform: translateZ(0); /* Force GPU */
      }
      .reveal-up { transform: translateY(40px); }
      .reveal-left { transform: translateX(-40px); }
      .reveal-right { transform: translateX(40px); }
      
      .reveal-visible { 
        opacity: 1; 
        transform: translate(0,0) translateZ(0); 
        filter: blur(0);
      }

      /* 3D VIP Effects - Optimized for Mobile */
      .vip-3d-container {
        perspective: 1000px;
      }
      .vip-3d-card {
        transform-style: preserve-3d;
        transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      @media (min-width: 768px) {
        .vip-3d-card:hover {
          transform: rotateY(8deg) rotateX(4deg) translateY(-8px) translateZ(10px);
        }
      }

      .btn-luxury-gradient {
        background: linear-gradient(90deg, #f59e0b, #fbbf24, #d97706);
        background-size: 200% auto;
        box-shadow: 0 10px 30px -5px rgba(245, 158, 11, 0.4);
        transform: translateZ(0);
      }
      .btn-luxury-gradient:hover { background-position: right center; transform: scale(1.03) translateZ(0); }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }

      .no-scroll-jank {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="selection:bg-primary selection:text-white no-scroll-jank">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
